{% extends 'base.html' %}

{% block title %}{% if object %}Edit{% else %}Add{% endif %} Cold Room{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>{% if object %}Edit{% else %}Add{% endif %} Cold Room</h2>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'coldroom-dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% block scripts %}
<script>
    // Initialize map for location selection
    document.addEventListener('DOMContentLoaded', function() {
        const map = L.map('id_location').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        // Add marker for existing location
        {% if object %}
            const marker = L.marker([{{ object.location.y }}, {{ object.location.x }}]).addTo(map);
            map.setView([{{ object.location.y }}, {{ object.location.x }}], 13);
        {% endif %}
        
        // Handle new location selection
        map.on('click', function(e) {
            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }
            document.getElementById('id_location_0').value = e.latlng.lng;
            document.getElementById('id_location_1').value = e.latlng.lat;
        });
    });
</script>
{% endblock %}
{% endblock %}
